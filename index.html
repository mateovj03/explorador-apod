<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="icon" type="image/png" href="./img/logof.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <title>APOD</title>
  </head>

  <body>
    <!--buscador-->
    <section class="container">
      <div class="mb-3">
        <label for="fechaInput" class="form-label">Busca tu fecha fav</label>
        <input
          type="date"
          class="form-control"
          id="fechaInput"
          min="1995-06-16"
        />
        <button type="button" id="btn-buscar" class="btn btn-primary mt-2">
          Buscar
        </button>
      </div>

      <div id="mensaje" class="alert alert-danger" hidden></div>
    </section>

    <!--Contenedor principal-->
    <section class="container" id="resultado">
      <h1>Imagen astronómica del día</h1>
      <div class="row g-4">
        <!--Columna para la imagen-->
        <div class="col-12 col-md-7">
          <img id="imagenApod" src="" alt="" class="img-fluid" />
        </div>

        <!--Columna para el contenido-->
        <div class="col-12 col-md-5">
          <div class="d-flex justify-content-between align-items-center gap-2">
            <h2 id="tituloApod">Titulo</h2>
            <button
              type="button"
              id="btn-favorito"
              class="btn btn-outline-danger"
            >
              ❤️
            </button>
          </div>

          <p id="fechaApod" class="text-muted"></p>
          <a id="enlaceVideo" href="#" target="_blank" hidden
            >Ver el video en NASA</a
          >
          <div id="descripcionApod">Descripcion</div>
        </div>
      </div>
    </section>

    <script src="node_modules/dayjs/dayjs.min.js"></script>
    <script src="node_modules/dayjs/locale/es.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
